from pathlib import Path
p = Path("/mnt/data/build-firmware.yml")
p.write_text(r'''name: Build E8372h Zong modified firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ORIGINAL_URL: https://github.com/saqie1393/huawei_balong_modfw_kitchen/releases/download/firmware-v1/E8372h_UPDATE_21.333.64.00.1456_WEBUI_17.100.20.01.1456_RE5.bin
      ORIGINAL_NAME: E8372h_UPDATE_21.333.64.00.1456_WEBUI_17.100.20.01.1456_RE5.bin
      WEBUI_VERSION: WEBUI_17.100.20.01.1456_RE5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and i386 compatibility
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential qtbase5-dev zlib1g-dev cpio gzip file libc6:i386

      - name: Download original firmware
        run: |
          set -euo pipefail
          mkdir -p work orig_fw
          curl -fL "$ORIGINAL_URL" -o "work/$ORIGINAL_NAME"
          test -s "work/$ORIGINAL_NAME"

      - name: Check bundled sign tool
        run: |
          set -euo pipefail
          if [[ ! -f ./sign ]]; then
            echo "ERROR: ./sign not found in repository root."
            find . -type f -name sign -print
            exit 1
          fi
          file ./sign
          chmod +x ./sign
          # Smoke-test that the 32-bit Linux executable starts.
          # Help/usage may return a non-zero status when no arguments are given.
          ./sign >/tmp/sign-help.txt 2>&1 || true
          cat /tmp/sign-help.txt

      - name: Compile firmware partition tool
        run: |
          set -euo pipefail
          g++ -O2 -Wall -fPIC -no-pie \
            tools/bake_firmware.cpp \
            tools/ptable.cpp \
            tools/sio.cpp \
            -o work/bake_firmware \
            $(pkg-config --cflags --libs Qt5Widgets Qt5Core) \
            -lz

      - name: Remove signature from original firmware
        run: |
          set -euo pipefail
          ./sign -r "work/$ORIGINAL_NAME" work/original_r.bin
          test -s work/original_r.bin
          file work/original_r.bin

      - name: Extract System and APP partitions
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=offscreen work/bake_firmware extract \
            work/original_r.bin work/System.bin work/APP.bin
          test -s work/System.bin
          test -s work/APP.bin
          file work/System.bin work/APP.bin

      - name: Unpack original CPIO filesystems
        run: |
          set -euo pipefail
          mkdir -p orig_fw/system orig_fw/app
          (cd orig_fw/system && cpio -idm --no-absolute-filenames < ../../work/System.bin)
          (cd orig_fw/app && cpio -idm --no-absolute-filenames < ../../work/APP.bin)

      - name: Build modified filesystems
        run: |
          set -euo pipefail
          ./build.sh v7r11 e8372h-153_zong_21.333.64.00.1456 orig_fw
          test -s workdir/system.cpio
          test -s workdir/app.cpio

      - name: Replace System and APP partitions
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=offscreen work/bake_firmware replace \
            work/original_r.bin \
            workdir/system.cpio \
            workdir/app.cpio \
            work/modified_r.bin
          test -s work/modified_r.bin
          ls -lh work/modified_r.bin

      - name: Sign modified firmware
        env:
          PRIVATE_KEY_B64: ${{ secrets.PRIVATE_KEY_B64 }}
          PUBLIC_KEY_B64: ${{ secrets.PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail

          if [[ -z "${PRIVATE_KEY_B64:-}" || -z "${PUBLIC_KEY_B64:-}" ]]; then
            echo "ERROR: Add PRIVATE_KEY_B64 and PUBLIC_KEY_B64 under Settings > Secrets and variables > Actions."
            exit 1
          fi

          printf '%s' "$PRIVATE_KEY_B64" | base64 -d > work/private.key
          printf '%s' "$PUBLIC_KEY_B64" | base64 -d > work/public.key

          # NOTE: This assumes sign -s accepts:
          # input output private-key public-key -sv 1.3 -i ISO:<version> WEBUI:<version>.
          # Confirm this syntax against the bundled sign tool's documented usage before relying on output.
          ./sign -s \
            work/modified_r.bin \
            work/firmware-signed.bin \
            work/private.key \
            work/public.key \
            -sv 1.3 \
            -i "ISO:$WEBUI_VERSION" "WEBUI:$WEBUI_VERSION"

          test -s work/firmware-signed.bin
          file work/firmware-signed.bin

      - name: Prepare output files
        run: |
          set -euo pipefail
          mkdir -p output
          cp work/firmware-signed.bin output/
          cp work/modified_r.bin work/System.bin work/APP.bin output/
          cp workdir/system.cpio workdir/app.cpio output/
          sha256sum output/* > output/SHA256SUMS.txt
          find output -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e8372h-zong-signed-firmware
          path: output/
          if-no-files-found: error
          retention-days: 7
''', encoding="utf-8")
print(f"Updated {p} ({p.stat().st_size} bytes)")


name: Build E8372h Zong Modified Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ORIGINAL_URL: https://github.com/saqie1393/huawei_balong_modfw_kitchen/releases/download/firmware-v1/E8372h_UPDATE_21.333.64.00.1456_WEBUI_17.100.20.01.1456_RE5.bin
      ORIGINAL_NAME: E8372h_UPDATE_21.333.64.00.1456_WEBUI_17.100.20.01.1456_RE5.bin
      WEBUI_VERSION: "17.100.20.01.1456"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qtbase5-dev \
            zlib1g-dev \
            cpio \
            gzip \
            file \
            libc6:i386

      - name: Check repository files
        run: |
          set -euo pipefail

          test -f ./build.sh
          test -f ./sign
          test -f ./private.key
          test -f ./public.key

          chmod +x ./sign ./build.sh

          echo "===== Sign binary ====="
          file ./sign

          echo "===== Signing keys ====="
          file ./private.key ./public.key

          echo "===== Repository files checked ====="

      - name: Download original firmware
        run: |
          set -euo pipefail

          mkdir -p work orig_fw output

          curl -fL "$ORIGINAL_URL" \
            -o "work/$ORIGINAL_NAME"

          test -s "work/$ORIGINAL_NAME"
          file "work/$ORIGINAL_NAME"

      - name: Compile firmware partition tool
        run: |
          set -euo pipefail

          g++ -O2 -Wall -fPIC -no-pie \
            tools/bake_firmware.cpp \
            tools/ptable.cpp \
            tools/sio.cpp \
            -o work/bake_firmware \
            $(pkg-config --cflags --libs Qt5Widgets Qt5Core) \
            -lz

          test -x work/bake_firmware

      - name: Remove original firmware signature
        run: |
          set -euo pipefail

          ./sign -r \
            "work/$ORIGINAL_NAME" \
            work/original_r.bin

          test -s work/original_r.bin
          ls -lh work/original_r.bin

      - name: Extract System and APP partitions
        run: |
          set -euo pipefail

          QT_QPA_PLATFORM=offscreen \
            work/bake_firmware extract \
            work/original_r.bin \
            work/System.bin \
            work/APP.bin

          test -s work/System.bin
          test -s work/APP.bin

          ls -lh work/System.bin work/APP.bin

      - name: Unpack original filesystems
        run: |
          set -euo pipefail

          mkdir -p orig_fw/system orig_fw/app

          (
            cd orig_fw/system
            cpio -idm --no-absolute-filenames \
              < ../../work/System.bin
          )

          (
            cd orig_fw/app
            cpio -idm --no-absolute-filenames \
              < ../../work/APP.bin
          )

      - name: Build modified firmware filesystems
        run: |
          set -euo pipefail

          ./build.sh \
            v7r11 \
            e8372h-153_zong_21.333.64.00.1456 \
            orig_fw

          test -s workdir/system.cpio
          test -s workdir/app.cpio

      - name: Replace System and APP partitions
        run: |
          set -euo pipefail

          QT_QPA_PLATFORM=offscreen \
            work/bake_firmware replace \
            work/original_r.bin \
            workdir/system.cpio \
            workdir/app.cpio \
            work/modified_r.bin

          test -s work/modified_r.bin
          ls -lh work/modified_r.bin

      - name: Sign modified firmware
        run: |
          set -euo pipefail

          test -s ./private.key
          test -s ./public.key

          ./sign -s \
            work/modified_r.bin \
            work/firmware-signed.bin \
            ./private.key \
            ./public.key \
            -sv 1.3 \
            -i "WEBUI:$WEBUI_VERSION"

          test -s work/firmware-signed.bin

          echo "===== Signed output file ====="
          ls -lh work/firmware-signed.bin
          file work/firmware-signed.bin
          sha256sum work/firmware-signed.bin

      - name: Prepare artifacts
        run: |
          set -euo pipefail

          cp work/firmware-signed.bin \
            output/firmware-signed.bin

          cp work/modified_r.bin \
            output/modified-unsigned.bin

          cp work/System.bin work/APP.bin output/
          cp workdir/system.cpio workdir/app.cpio output/

          sha256sum output/* \
            > output/SHA256SUMS.txt

          find output -maxdepth 1 -type f \
            -printf '%f %s bytes\n'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e8372h-zong-firmware-build
          path: output/
          if-no-files-found: error
          retention-days: 7

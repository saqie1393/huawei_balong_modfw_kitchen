name: Huawei Balong ModFW Kitchen (Universal Builder)

on:
  workflow_dispatch:
    inputs:
      original_firmware:
        description: "Select Original Firmware (from GitHub Releases)"
        required: true
        type: choice
        options:
          - "E8372h_UPDATE_21.333.64.00.1456_WEBUI_17.100.20.01.1456_RE5.bin"
          - "E8372h-608_UPDATE_21.333.63.00.1460_WEBUI_17.100.21.00.1460_RE5.bin"
      family:
        description: "Balong family folder under base/"
        required: true
        type: choice
        options:
          - v7r1
          - v7r11
          - v7r11_oled
          - v7r1_oled
          - v7r2
          - v7r2_oled
      device_overlay:
        description: "Choose the exact folder/path from device_overlay/"
        required: true
        type: choice
        options:
          - "e5372_21.290.23.00.00/root"
          - "e5377_21.316.17.00.00"
          - "e5573cs-609_21.328.62.00.1460"
          - "e5573cs-609_zong_21.333.64.00.1460"
          - "e5573cs_zong_21.328.62.00.1456/root/system"
          - "e5573cs_zong_21.333.64.01.1456"
          - "e5577s_Bs_tishknet_21.327.62.01.1365/root"
          - "e5770_21.329.01.00.00"
          - "e8372h-153_telma_21.333.64.01.187"
          - "e8372h-153_zong_21.328.62.02.1460/root/system"
          - "e8372h-153_zong_21.333.64.00.1456"
          - "e8372h-608_telenor_21.333.63.00.1460"
      firmware_version:
        description: "Firmware Version (e.g. 21.333.64.00.1456)"
        required: true
        type: string
        default: "21.333.64.00.1456"
      webui_version:
        description: "WEBUI Version (e.g. WEBUI_17.100.20.01.1456_RE5)"
        required: true
        type: string
        default: "WEBUI_17.100.20.01.1456_RE5"

permissions:
  contents: write

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      # Base URL where your original firmwares are stored
      FIRMWARE_BASE_URL: "https://github.com/saqie1393/huawei_balong_modfw_kitchen/releases/download/firmware-v1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential qtbase5-dev zlib1g-dev cpio gzip file curl libc6:i386

      - name: Validate selected family and overlay
        shell: bash
        env:
          FAMILY: ${{ inputs.family }}
          OVERLAY: ${{ inputs.device_overlay }}
        run: |
          set -euo pipefail
          if [ ! -d "base/$FAMILY" ]; then
            echo "::error::base/$FAMILY does not exist."
            exit 1
          fi
          if [ ! -d "device_overlay/$OVERLAY" ]; then
            echo "::error::device_overlay/$OVERLAY does not exist."
            echo "Available overlays:"
            find device_overlay -mindepth 1 -maxdepth 4 -type d -printf '%P\n' | sort
            exit 1
          fi

      - name: Check required files
        run: |
          set -euo pipefail
          test -f ./build.sh
          test -f ./sign
          test -f ./private.key
          test -f ./public.key
          test -f tools/bake_firmware.cpp
          test -f tools/ptable.cpp
          test -f tools/sio.cpp
          chmod +x ./sign ./build.sh

      - name: Compile firmware partition tool
        run: |
          set -euo pipefail
          mkdir -p work
          g++ -O2 -Wall -fPIC -no-pie \
            tools/bake_firmware.cpp tools/ptable.cpp tools/sio.cpp \
            -o work/bake_firmware \
            $(pkg-config --cflags --libs Qt5Widgets Qt5Core) -lz
          test -x work/bake_firmware

      - name: Download and prepare original firmware
        env:
          FIRMWARE_NAME: ${{ inputs.original_firmware }}
          BASE_URL: ${{ env.FIRMWARE_BASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p work orig_fw output
          
          DOWNLOAD_URL="${BASE_URL}/${FIRMWARE_NAME}"
          echo "Downloading from: $DOWNLOAD_URL"
          
          curl -fL --retry 3 "$DOWNLOAD_URL" -o "work/$FIRMWARE_NAME"
          test -s "work/$FIRMWARE_NAME"
          
          ./sign -r "work/$FIRMWARE_NAME" work/original_r.bin
          test -s work/original_r.bin

      - name: Extract System and APP partitions
        run: |
          set -euo pipefail
          work/bake_firmware extract \
            work/original_r.bin \
            work/System.bin \
            work/APP.bin
          test -s work/System.bin
          test -s work/APP.bin

      - name: Unpack original filesystems
        run: |
          set -euo pipefail
          mkdir -p orig_fw/system orig_fw/app
          (cd orig_fw/system && cpio -idm --no-absolute-filenames < ../../work/System.bin)
          (cd orig_fw/app && cpio -idm --no-absolute-filenames < ../../work/APP.bin)

      - name: Build modified firmware filesystems
        env:
          FAMILY: ${{ inputs.family }}
          OVERLAY: ${{ inputs.device_overlay }}
        run: |
          set -euo pipefail
          ./build.sh "$FAMILY" "$OVERLAY" orig_fw
          test -s workdir/system.cpio
          test -s workdir/app.cpio

      - name: Replace System and APP partitions
        run: |
          set -euo pipefail
          work/bake_firmware replace \
            work/original_r.bin \
            workdir/system.cpio \
            workdir/app.cpio \
            work/modified_r.bin
          test -s work/modified_r.bin

      - name: Sign modified firmware
        env:
          FW_VER: ${{ inputs.firmware_version }}
          WEBUI_VER: ${{ inputs.webui_version }}
        run: |
          set -euo pipefail
          ./sign -s \
            work/modified_r.bin \
            work/firmware-signed.bin \
            ./private.key ./public.key \
            -sv 1.3 \
            -i "FW:$FW_VER ISO:$WEBUI_VER WEBUI:$WEBUI_VER"
          
          test -s work/firmware-signed.bin

      - name: Prepare artifacts
        id: prepare
        run: |
          set -euo pipefail
          
          # Yeh line ".bin" ko replace karke sahi naam banayegi
          FW_NAME="$(basename "${{ inputs.original_firmware }}" .bin)_modfw"
          FINAL_FILE="${FW_NAME}.bin"
          
          # Only copy the SIGNED file (no unsigned file)
          cp work/firmware-signed.bin "output/$FINAL_FILE"
          
          sha256sum output/* > output/SHA256SUMS.txt
          ls -lh output/
          
          # Export variables for the Release step
          echo "firmware_name=$FW_NAME" >> $GITHUB_OUTPUT
          echo "firmware_file=$FINAL_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.prepare.outputs.firmware_name }}"
          name: "${{ steps.prepare.outputs.firmware_name }}"
          body: |
            Automated custom firmware build.
            - **Original Firmware:** ${{ inputs.original_firmware }}
            - **Family:** ${{ inputs.family }}
            - **Overlay:** ${{ inputs.device_overlay }}
            - **Firmware Version:** ${{ inputs.firmware_version }}
            - **WEBUI Version:** ${{ inputs.webui_version }}
          files: |
            output/${{ steps.prepare.outputs.firmware_file }}
            output/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: balong-final-firmware
          path: output/
          if-no-files-found: error
          retention-days: 7

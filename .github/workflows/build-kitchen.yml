name: Huawei Balong ModFW Kitchen

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Original firmware .bin direct download URL"
        required: true
        type: string
        default: "https://github.com/saqie1393/huawei_balong_modfw_kitchen/releases/download/firmware-v1/E8372h_UPDATE_21.333.64.00.1456_WEBUI_17.100.20.01.1456_RE5.bin"
      family:
        description: "Balong family folder under base/"
        required: true
        type: choice
        options:
          - v7r11
          - v7r2
          - v7r1
      device_overlay:
        description: "Choose the exact folder/path from device_overlay/"
        required: true
        type: choice
        options:
          - "e5372_21.290.23.00.00/root"
          - "e5377_21.316.17.00.00"
          - "e5573cs-609_21.328.62.00.1460"
          - "e5573cs-609_zong_21.333.64.00.1460"
          - "e5573cs_zong_21.328.62.00.1456/root/system"
          - "e5573cs_zong_21.333.64.01.1456"
          - "e5577s_Bs_tishknet_21.327.62.01.1365/root"
          - "e5770_21.329.01.00.00"
          - "e8372h-153_telma_21.333.64.01.187"
          - "e8372h-153_zong_21.328.62.02.1460/root/system"
          - "e8372h-153_zong_21.333.64.00.1456"
          - "e8372h-608_telenor_21.333.63.00.1460"

permissions:
  contents: read

jobs:
  validate-and-download:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate selected family and overlay
        shell: bash
        env:
          FAMILY: ${{ inputs.family }}
          OVERLAY: ${{ inputs.device_overlay }}
        run: |
          set -euo pipefail
          if [ ! -d "base/$FAMILY" ]; then
            echo "::error::base/$FAMILY does not exist in this branch."
            echo "Available base directories:"
            find base -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
            exit 1
          fi
          if [ ! -d "device_overlay/$OVERLAY" ]; then
            echo "::error::device_overlay/$OVERLAY does not exist in this branch."
            echo "Available overlay directories:"
            find device_overlay -mindepth 1 -maxdepth 4 -type d -printf '%P\n' | sort
            exit 1
          fi
          echo "Selected family: $FAMILY"
          echo "Selected overlay: $OVERLAY"

      - name: Download selected firmware
        shell: bash
        env:
          FIRMWARE_URL: ${{ inputs.firmware_url }}
        run: |
          set -euo pipefail
          mkdir -p input output
          curl --fail --location --retry 3 --retry-delay 2 "$FIRMWARE_URL" -o input/original.bin
          test -s input/original.bin
          file input/original.bin
          sha256sum input/original.bin | tee output/original.sha256

      - name: Upload downloaded input for verification
        uses: actions/upload-artifact@v4
        with:
          name: balong-input-${{ inputs.family }}
          path: |
            input/original.bin
            output/original.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        shell: bash
        env:
          FAMILY: ${{ inputs.family }}
          OVERLAY: ${{ inputs.device_overlay }}
        run: |
          {
            echo "## Selected build settings"
            echo "- Firmware URL: provided"
            echo "- Balong family: \`$FAMILY\`"
            echo "- Device overlay: \`$OVERLAY\`"
            echo
            echo "Firmware downloaded and overlay validated."
            echo
            echo "**Important:** This workflow currently only validates the selection and downloads the firmware. It does not yet extract firmware partitions, run build.sh, replace partitions, or sign a final firmware. Those steps require a verified command-line unpacker/replacer."
          } >> "$GITHUB_STEP_SUMMARY"

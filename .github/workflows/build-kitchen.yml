name: Huawei Balong ModFW Kitchen

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Original firmware .bin direct download URL"
        required: true
        type: string
        default: "https://github.com/saqie1393/huawei_balong_modfw_kitchen/releases/download/firmware-v1/E8372h_UPDATE_21.333.64.00.1456_WEBUI_17.100.20.01.1456_RE5.bin"
      family:
        description: "Balong family folder under base/"
        required: true
        type: choice
        options:
          - v7r11
          - v7r2
          - v7r1
      device_overlay:
        description: "Exact overlay folder name from device_overlay/ (copy from the list in the workflow log)"
        required: true
        type: string
        default: "e8372h-153_zong_21.333.64.00.1456"

permissions:
  contents: read

jobs:
  list-and-validate:
    runs-on: ubuntu-latest
    outputs:
      overlay_ok: ${{ steps.validate.outputs.overlay_ok }}
    steps:
      - name: Checkout this kitchen repository
        uses: actions/checkout@v4

      - name: Show overlays available in this repository
        shell: bash
        run: |
          set -euo pipefail
          echo "Available device_overlay folders:"
          find device_overlay -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tee /tmp/overlay-list.txt
          echo
          echo "Selected overlay: ${{ inputs.device_overlay }}"

      - name: Validate family and selected overlay
        id: validate
        shell: bash
        env:
          FAMILY: ${{ inputs.family }}
          OVERLAY: ${{ inputs.device_overlay }}
        run: |
          set -euo pipefail
          test -d "base/$FAMILY" || {
            echo "::error::base/$FAMILY does not exist. Available base folders:"
            find base -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
            exit 1
          }
          if [ ! -d "device_overlay/$OVERLAY" ]; then
            echo "::error::Selected overlay folder does not exist: device_overlay/$OVERLAY"
            echo "Select/copy an exact folder name from the list printed in the previous step."
            echo "Available device_overlay folders:"
            find device_overlay -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort
            exit 1
          fi
          echo "overlay_ok=true" >> "$GITHUB_OUTPUT"
          echo "Validated: family=$FAMILY overlay=$OVERLAY"

  prepare-firmware:
    needs: list-and-validate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout this kitchen repository
        uses: actions/checkout@v4

      - name: Install required utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl file cpio gzip xz-utils p7zip-full

      - name: Download selected firmware URL
        shell: bash
        env:
          FIRMWARE_URL: ${{ inputs.firmware_url }}
        run: |
          set -euo pipefail
          mkdir -p input output
          curl --fail --location --retry 3 --retry-delay 2 "$FIRMWARE_URL" -o input/original.bin
          test -s input/original.bin
          echo "Downloaded firmware:"
          file input/original.bin
          sha256sum input/original.bin | tee output/original.sha256

      - name: Check signing files exist
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f sign ]; then
            echo "::error::sign utility is missing from repository root."
            exit 1
          fi
          if [ ! -f public.key ]; then
            echo "::error::public.key is missing from repository root."
            exit 1
          fi
          if [ ! -f private.key ]; then
            echo "::error::private.key is missing. For a public repository, store it as a GitHub Actions Secret instead of committing it."
            exit 1
          fi
          file sign

      - name: Upload downloaded firmware and overlay selection report
        uses: actions/upload-artifact@v4
        with:
          name: firmware-input-and-overlay-${{ inputs.family }}
          path: |
            input/original.bin
            output/original.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Explain next integration requirement
        shell: bash
        env:
          FAMILY: ${{ inputs.family }}
          OVERLAY: ${{ inputs.device_overlay }}
        run: |
          {
            echo "## Validated build selection"
            echo "- Family: \`$FAMILY\`"
            echo "- Overlay: \`$OVERLAY\`"
            echo "- Firmware downloaded and saved as artifact."
            echo
            echo "This workflow currently validates the selected overlay and downloads the firmware."
            echo "It does not yet extract/replace firmware partitions or produce a signed modified .bin."
            echo "Those steps require a verified command-line firmware unpacker/replacer; the kitchen build.sh expects already-extracted orig_fw/system and orig_fw/app directories."
          } >> "$GITHUB_STEP_SUMMARY"
